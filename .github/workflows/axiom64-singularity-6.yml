name: Axiom64 Singularity 6 qualification

on:
  workflow_dispatch:
  push:
    branches:
      - axiom64-singularity-6-20260901
    paths:
      - 'axiom64-singularity-6.0.0/**'
      - '.github/workflows/axiom64-singularity-6.yml'

permissions:
  contents: read

concurrency:
  group: axiom64-singularity-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install assembler, firmware, emulator and TPM toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            nasm lld binutils gcc make qemu-system-x86 ovmf mtools \
            sbsigntool swtpm swtpm-tools tpm2-tools \
            python3 python3-z3 python3-virt-firmware zip unzip

      - name: Compile BIOS, UEFI and assembly subsystems
        working-directory: axiom64-singularity-6.0.0
        env:
          LC_ALL: C
          TZ: UTC
          SOURCE_DATE_EPOCH: '0'
        run: |
          chmod +x tools/qualification.sh tests/model.py tests/prove.py tools/check.py
          make clean all

      - name: Execute native assembly subsystem tests
        working-directory: axiom64-singularity-6.0.0
        run: make host-test

      - name: Explore bounded architecture state space
        working-directory: axiom64-singularity-6.0.0
        run: make model-test

      - name: Prove symbolic subsystem invariants
        working-directory: axiom64-singularity-6.0.0
        run: make proof-test

      - name: Validate binaries and release structure
        working-directory: axiom64-singularity-6.0.0
        run: |
          python3 tools/check.py --build build | tee build/structural-report.txt
          grep -q 'status: PASS' build/structural-report.txt

      - name: Boot BIOS and authenticated UEFI paths and attest TPM state
        working-directory: axiom64-singularity-6.0.0
        env:
          QEMU: qemu-system-x86_64
        run: bash tools/qualification.sh

      - name: Package qualified release
        working-directory: axiom64-singularity-6.0.0
        env:
          LC_ALL: C
          TZ: UTC
          SOURCE_DATE_EPOCH: '0'
        run: make package-only

      - name: Upload qualified release and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Axiom64-Singularity-6.0.0-qualified
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            axiom64-singularity-6.0.0/dist/*
            axiom64-singularity-6.0.0/build/*-report.txt
            axiom64-singularity-6.0.0/build/qemu-*.log
            axiom64-singularity-6.0.0/build/tpm-*.log
            axiom64-singularity-6.0.0/build/tpm-*.txt
            axiom64-singularity-6.0.0/build/quote.*
            axiom64-singularity-6.0.0/build/ak.pub.pem
